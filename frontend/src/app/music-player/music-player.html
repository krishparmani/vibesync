<div class="music-player">

  <div class="album-art" [class.playing]="isPlaying">
    <img
      [src]="coverUrl"
      [alt]="trackTitle + ' album artwork'">
  </div>

  <div class="track-info">
    <p class="label">NOW PLAYING</p>
    <h3>{{ trackTitle }}</h3>
    <p class="artist">{{ artist }}</p>
  </div>

  <div class="player-controls">

    <button
      class="control-button"
      (click)="previousTrack()">
      ⏮
    </button>

    <button
      class="control-button play-button"
      (click)="togglePlay(audioPlayer)">
      {{ isPlaying ? '❚❚' : '▶' }}
    </button>

    <button
      class="control-button"
      (click)="nextTrack()">
      ⏭
    </button>

    <button
      class="control-button mute-button"
      (click)="toggleMute(audioPlayer)">
      {{ audioPlayer.muted ? '🔇' : '🔊' }}
    </button>

    <input
      type="range"
      min="0"
      max="1"
      step="0.01"
      [value]="volume"
      (input)="changeVolume($event, audioPlayer)"
      class="volume-slider">

  </div>

  <audio
    #audioPlayer
    (play)="isPlaying = true"
    (pause)="isPlaying = false"
    (ended)="nextTrack()">
  </audio>

</div>
